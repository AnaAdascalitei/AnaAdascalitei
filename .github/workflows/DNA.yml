name: Generate DNA helix

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:      # run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build helix from contributions
        run: python3 scripts/dna_helix.py ${{ github.repository_owner }} dist/dna-helix.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
